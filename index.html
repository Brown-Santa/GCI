<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Card Impact — Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#14213D;
    --navy-light:#1F3159;
    --red:#B3202F;
    --amber:#C9822A;
    --green:#2F8F5B;
    --bg:#F4F1EA;
    --card:#FFFFFF;
    --border:#E4E0D6;
    --text:#14213D;
    --muted:#6B7280;
    --muted-2:#9AA3AE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  a{color:var(--navy);}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy);
    padding:20px;
  }
  .login-card{
    background:var(--card);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:28px;
  }
  .login-logo .mark{
    width:44px;height:44px;border-radius:10px;background:var(--red);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:18px;flex-shrink:0;
  }
  .login-logo .name{font-size:17px;font-weight:700;color:var(--navy);}
  .login-logo .sub{font-size:12px;color:var(--muted);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;background:#FAFAF7;
  }
  .field input:focus{outline:2px solid var(--navy);outline-offset:1px;}
  #loginBtn{
    width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);
    color:#fff;font-size:14.5px;font-weight:600;margin-top:6px;
  }
  #loginBtn:hover{background:var(--navy-light);}
  #loginError{color:var(--red);font-size:13px;margin-top:12px;display:none;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}

  .sidebar{
    width:260px;flex-shrink:0;background:var(--navy);color:#fff;
    display:flex;flex-direction:column;padding:28px 0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{
    display:flex;align-items:center;gap:10px;padding:0 24px 24px 24px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .sidebar-brand .mark{
    width:34px;height:34px;border-radius:8px;background:var(--red);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    font-size:15px;color:#fff;flex-shrink:0;
  }
  .sidebar-brand .name{font-size:14px;font-weight:700;line-height:1.2;}
  .sidebar-brand .sub{font-size:11px;color:rgba(255,255,255,0.55);}

  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;
    color:rgba(255,255,255,0.9);
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);}
  .nav-item.active{background:rgba(255,255,255,0.14);font-weight:600;color:#fff;}
  .nav-dash{margin:18px 12px 4px 12px;}
  .nav-section-label{
    padding:16px 24px 6px 24px;font-size:11px;font-weight:700;
    letter-spacing:0.6px;color:rgba(255,255,255,0.45);
  }
  .nav-tasks{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-completed{background:var(--green);}
  .dot-ongoing{background:var(--amber);}
  .dot-not_started{background:#9AA3AE;}

  .sidebar-footer{
    margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,0.12);
    font-size:12px;color:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:space-between;
  }
  .sidebar-footer button{
    background:none;border:none;color:rgba(255,255,255,0.6);font-size:12px;text-decoration:underline;
  }

  .main{flex-grow:1;padding:40px 48px;max-width:1100px;}
  .page-title{font-size:26px;font-weight:700;color:var(--navy);}
  .page-sub{font-size:14px;color:var(--muted);margin-top:4px;}
  .page-header{margin-bottom:32px;}

  /* ---------- DASHBOARD ---------- */
  .stat-row{display:flex;gap:20px;margin-bottom:36px;}
  .stat-card{
    flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;
  }
  .stat-label{font-size:13px;font-weight:600;color:var(--muted);}
  .stat-num{font-size:40px;font-weight:700;margin-top:8px;}
  .stat-of{font-size:12px;color:var(--muted-2);margin-top:4px;}

  .section-label{
    font-size:13px;font-weight:700;color:var(--navy);letter-spacing:0.4px;margin-bottom:12px;
  }
  .task-list{display:flex;flex-direction:column;gap:10px;}
  .task-row{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  }
  .task-row:hover{border-color:var(--navy);}
  .task-row-left{display:flex;align-items:center;gap:12px;}
  .task-row-name{font-size:15px;font-weight:600;color:var(--navy);}
  .task-row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .status-badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;white-space:nowrap;}
  .badge-completed{color:var(--green);background:rgba(47,143,91,0.12);}
  .badge-ongoing{color:var(--amber);background:rgba(201,130,42,0.14);}
  .badge-not_started{color:var(--muted);background:#EEF0F2;}

  /* ---------- TASK DETAIL ---------- */
  .back-link{font-size:13px;color:var(--muted);margin-bottom:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .back-link:hover{color:var(--navy);}
  .detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .status-picker{display:flex;gap:6px;}
  .status-opt{
    font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--border);
    background:#fff;color:var(--muted);
  }
  .status-opt.sel-completed{background:var(--green);color:#fff;border-color:var(--green);}
  .status-opt.sel-ongoing{background:var(--amber);color:#fff;border-color:var(--amber);}
  .status-opt.sel-not_started{background:var(--muted-2);color:#fff;border-color:var(--muted-2);}

  .add-update-box{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:18px;
  }
  .add-update-box textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;
    font-family:inherit;resize:vertical;min-height:60px;background:#FAFAF7;
  }
  .add-update-box input[type=url]{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13.5px;
    margin-top:8px;background:#FAFAF7;
  }
  .add-update-box .row-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .btn-primary{
    background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;
  }
  .btn-primary:hover{background:var(--navy-light);}

  .update-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;
  }
  .update-body{font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.5;}
  .update-link{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:8px;
    color:var(--navy);text-decoration:underline;
  }
  .update-meta{font-size:11.5px;color:var(--muted-2);margin-top:8px;}
  .empty-state{color:var(--muted-2);font-size:13.5px;padding:20px 0;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">GC</div>
      <div>
        <div class="name">Green Card Impact</div>
        <div class="sub">EB-1A Case Tracker</div>
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button id="loginBtn">Sign In</button>
    <div id="loginError">Invalid email or password.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">GC</div>
      <div>
        <div class="name">Green Card Impact</div>
        <div class="sub">EB-1A Case Tracker</div>
      </div>
    </div>

    <div class="nav-item nav-dash active" data-nav="dashboard">
      <span>Dashboard</span>
    </div>

    <div class="nav-section-label">TASKS</div>
    <div class="nav-tasks" id="navTasks"><!-- injected --></div>

    <div class="sidebar-footer">
      <span id="userEmailLabel"></span>
      <button id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Dashboard view -->
    <div id="view-dashboard">
      <div class="page-header">
        <div class="page-title">Dashboard</div>
        <div class="page-sub">Overview of your EB-1A case progress</div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-num" id="statCompleted" style="color:var(--green);">0</div>
          <div class="stat-of" id="statCompletedOf">of 0 tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Ongoing</div>
          <div class="stat-num" id="statOngoing" style="color:var(--amber);">0</div>
          <div class="stat-of" id="statOngoingOf">of 0 tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Not Started</div>
          <div class="stat-num" id="statNotStarted" style="color:var(--muted-2);">0</div>
          <div class="stat-of" id="statNotStartedOf">of 0 tasks</div>
        </div>
      </div>

      <div class="section-label">ALL TASKS</div>
      <div class="task-list" id="dashboardTaskList"><!-- injected --></div>
    </div>

    <!-- Task detail view -->
    <div id="view-taskDetail" class="hidden">
      <div class="back-link" id="backToDashboard">&larr; Dashboard</div>
      <div class="detail-header">
        <div>
          <div class="page-title" id="detailTitle">Task</div>
        </div>
        <div class="status-picker" id="statusPicker"><!-- injected --></div>
      </div>

      <div class="add-update-box">
        <textarea id="updateBody" placeholder="Log an update — what happened, current status, any notes..."></textarea>
        <input type="url" id="updateLink" placeholder="Optional link (Google Sheet, Google Doc, etc.)">
        <div class="row-actions">
          <button class="btn-primary" id="addUpdateBtn">+ Add update</button>
        </div>
      </div>

      <div class="section-label">LOGGED UPDATES</div>
      <div id="updatesList"><!-- injected --></div>
    </div>
  </div>
</div>

<script>
  // ---- Supabase config: replace with your project's values ----
  const SUPABASE_URL = "https://xqrnzrwjbgxgdtkaoenv.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhxcm56cndqYmd4Z2R0a2FvZW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTg0MjksImV4cCI6MjEwMzU5NDQyOX0.rduYO0Vftzxm0swRvu_1-Z6ZTVi9K-kdpmL9vwYQ_5s";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const TASK_ORDER = ["foe","media_research","scholarly_articles","membership","judging","lor","merit_guide"];
  const STATUS_LABEL = { completed: "Completed", ongoing: "Ongoing", not_started: "Not Started" };

  let tasks = [];       // all 7 tasks
  let currentTaskId = null;

  // ---------------- AUTH ----------------
  async function handleLogin(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.style.display = "none";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = "Invalid email or password.";
      errEl.style.display = "block";
      return;
    }
    await enterApp();
  }

  async function handleLogout(){
    await supabaseClient.auth.signOut();
    document.getElementById("app").classList.remove("active");
    document.getElementById("loginScreen").style.display = "flex";
  }

  async function enterApp(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").classList.add("active");
    document.getElementById("userEmailLabel").textContent = session.user.email;
    await loadTasks();
    showDashboard();
  }

  // ---------------- DATA ----------------
  async function loadTasks(){
    const { data, error } = await supabaseClient
      .from("tasks")
      .select("*")
      .order("sort_order", { ascending: true });
    if (error) { console.error(error); return; }
    tasks = data || [];
    renderSidebarTasks();
  }

  async function loadUpdates(taskId){
    const { data, error } = await supabaseClient
      .from("updates")
      .select("*")
      .eq("task_id", taskId)
      .order("created_at", { ascending: false });
    if (error) { console.error(error); return []; }
    return data || [];
  }

  async function setTaskStatus(taskId, status){
    const { error } = await supabaseClient
      .from("tasks")
      .update({ status })
      .eq("id", taskId);
    if (error) { console.error(error); return; }
    const t = tasks.find(t => t.id === taskId);
    if (t) t.status = status;
    renderSidebarTasks();
    if (document.getElementById("view-dashboard").classList.contains("hidden") === false) {
      renderDashboard();
    }
    if (currentTaskId === taskId) renderStatusPicker(taskId);
  }

  async function addUpdate(taskId, body, link){
    if (!body.trim()) return;
    const { error } = await supabaseClient
      .from("updates")
      .insert({ task_id: taskId, body: body.trim(), link_url: link.trim() || null });
    if (error) { console.error(error); return; }
    document.getElementById("updateBody").value = "";
    document.getElementById("updateLink").value = "";
    await openTaskDetail(taskId);
  }

  // ---------------- RENDER: SIDEBAR ----------------
  function renderSidebarTasks(){
    const el = document.getElementById("navTasks");
    el.innerHTML = "";
    tasks.forEach(t => {
      const div = document.createElement("div");
      div.className = "nav-item" + (currentTaskId === t.id ? " active" : "");
      div.dataset.taskId = t.id;
      div.innerHTML = `<span>${escapeHtml(t.name)}</span><span class="status-dot dot-${t.status}"></span>`;
      div.addEventListener("click", () => openTaskDetail(t.id));
      el.appendChild(div);
    });
  }

  // ---------------- RENDER: DASHBOARD ----------------
  function showDashboard(){
    currentTaskId = null;
    document.getElementById("view-dashboard").classList.remove("hidden");
    document.getElementById("view-taskDetail").classList.add("hidden");
    document.querySelector('.nav-item[data-nav="dashboard"]').classList.add("active");
    renderSidebarTasks();
    renderDashboard();
  }

  function renderDashboard(){
    const total = tasks.length;
    const completed = tasks.filter(t => t.status === "completed").length;
    const ongoing = tasks.filter(t => t.status === "ongoing").length;
    const notStarted = tasks.filter(t => t.status === "not_started").length;

    document.getElementById("statCompleted").textContent = completed;
    document.getElementById("statOngoing").textContent = ongoing;
    document.getElementById("statNotStarted").textContent = notStarted;
    document.getElementById("statCompletedOf").textContent = `of ${total} tasks`;
    document.getElementById("statOngoingOf").textContent = `of ${total} tasks`;
    document.getElementById("statNotStartedOf").textContent = `of ${total} tasks`;

    const list = document.getElementById("dashboardTaskList");
    list.innerHTML = "";
    tasks.forEach(t => {
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <div class="task-row-left">
          <span class="status-dot dot-${t.status}"></span>
          <div>
            <div class="task-row-name">${escapeHtml(t.name)}</div>
          </div>
        </div>
        <span class="status-badge badge-${t.status}">${STATUS_LABEL[t.status]}</span>
      `;
      row.addEventListener("click", () => openTaskDetail(t.id));
      list.appendChild(row);
    });
  }

  // ---------------- RENDER: TASK DETAIL ----------------
  async function openTaskDetail(taskId){
    currentTaskId = taskId;
    const t = tasks.find(t => t.id === taskId);
    if (!t) return;

    document.getElementById("view-dashboard").classList.add("hidden");
    document.getElementById("view-taskDetail").classList.remove("hidden");
    document.querySelector('.nav-item[data-nav="dashboard"]').classList.remove("active");
    renderSidebarTasks();

    document.getElementById("detailTitle").textContent = t.name;
    renderStatusPicker(taskId);

    const updates = await loadUpdates(taskId);
    const list = document.getElementById("updatesList");
    list.innerHTML = "";
    if (updates.length === 0) {
      list.innerHTML = `<div class="empty-state">No updates logged yet. Add the first one above.</div>`;
    } else {
      updates.forEach(u => {
        const card = document.createElement("div");
        card.className = "update-card";
        const date = new Date(u.created_at).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
        card.innerHTML = `
          <div class="update-body">${escapeHtml(u.body)}</div>
          ${u.link_url ? `<a class="update-link" href="${escapeAttr(u.link_url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(u.link_url)}</a>` : ""}
          <div class="update-meta">${date}</div>
        `;
        list.appendChild(card);
      });
    }
  }

  function renderStatusPicker(taskId){
    const t = tasks.find(t => t.id === taskId);
    const el = document.getElementById("statusPicker");
    el.innerHTML = "";
    ["not_started","ongoing","completed"].forEach(s => {
      const btn = document.createElement("button");
      btn.className = "status-opt" + (t.status === s ? ` sel-${s}` : "");
      btn.textContent = STATUS_LABEL[s];
      btn.addEventListener("click", () => setTaskStatus(taskId, s));
      el.appendChild(btn);
    });
  }

  // ---------------- HELPERS ----------------
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
  function escapeAttr(str){
    return (str ?? "").replace(/"/g, "&quot;");
  }

  // ---------------- WIRE UP ----------------
  document.getElementById("loginBtn").addEventListener("click", handleLogin);
  document.getElementById("loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
  document.getElementById("logoutBtn").addEventListener("click", handleLogout);
  document.querySelector('.nav-item[data-nav="dashboard"]').addEventListener("click", showDashboard);
  document.getElementById("backToDashboard").addEventListener("click", showDashboard);
  document.getElementById("addUpdateBtn").addEventListener("click", () => {
    addUpdate(currentTaskId, document.getElementById("updateBody").value, document.getElementById("updateLink").value);
  });

  // On load, check if already logged in
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) await enterApp();
  })();
</script>
</body>
</html>
